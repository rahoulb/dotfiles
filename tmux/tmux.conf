set -g base-index 1

# Terminal features for nvim 0.12 inside tmux 3.6:
#   RGB    — pass 24-bit color through (needed by NvChad's vesper theme)
#   sync   — advertise DEC mode 2026 (synchronized output) so nvim batches
#            frame updates atomically; without this, plugin-heavy nvim tears
#            because tmux paints every partial update individually.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:sync"
set -as terminal-features ",xterm-ghostty:RGB:sync"
set -as terminal-features ",tmux-256color:RGB:sync"

# Prevent iTerm from inserting tmux control codes into the shell when switching tabs
# when iTerm tmux-integration is switched on
set-option -g focus-events off

set-option -g status on
set-option -g status-bg black
set-option -g status-fg white
set-option -g prefix C-q

# Allow Shift-Enter
set -g extended-keys on
set -g extended-keys-format csi-u

# Mouse + clipboard.
#
# mouse on       — two-finger trackpad scroll drops into copy-mode, which is
#                  how you page through scrollback on an iPad keyboard with no
#                  PageUp/PageDown.
# set-clipboard  — tmux emits OSC 52, so anything yanked (mouse drag or
#                  copy-mode selection) lands in the system clipboard of
#                  whichever machine you're sitting at, straight through SSH.
#
# iTerm2 needs Preferences -> General -> Selection -> "Applications in terminal
# may access clipboard" ticked. Hold Option while dragging in iTerm2 to bypass
# mouse reporting and use native selection instead.
set -g mouse on
set -g set-clipboard on
